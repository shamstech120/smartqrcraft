<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My QR codes | SmartQRCraft</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="app-main">
  <h1>My QR codes</h1>
  <p class="muted">A dynamic QR code points to a short link. You can change where it goes at any time, and see how many people scanned it. Print it once.</p>

  <section class="panel">
    <h2>Create a dynamic QR code</h2>
    <form id="create" novalidate>
      <div class="row">
        <div class="field grow">
          <label for="label">Name (only you see this)</label>
          <input id="label" maxlength="80" placeholder="Summer menu">
        </div>
        <div class="field grow2">
          <label for="dest">Where should it go?</label>
          <input id="dest" type="url" placeholder="https://example.com/menu" required>
        </div>
        <button class="btn btn-primary" type="submit" id="add">Create</button>
      </div>
      <p id="limit" class="muted small"></p>
      <p id="createErr" class="notice notice-err" hidden></p>
    </form>
  </section>

  <section id="list" aria-live="polite"></section>
  <p id="empty" class="muted" hidden>You have no dynamic QR codes yet. Create your first one above.</p>
</main>
<script src="/assets/qrcode-lib.js"></script>
<script src="/assets/qr-engine.js"></script>
<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
